<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4000b">
    <title>MARGINAL 102.1 FM</title>

    <link href="style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="lunaradio-animado.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            font-family: "Open Sans", sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fs-vid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .fs-vid-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #player-wrapper {
            position: relative;
            z-index: 9999;
            width: 100%;
            max-width: 480px;
            padding: 10px;
        }

        #player {
            width: 100% !important;
            min-height: 200px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 10px;
        }

        footer a {
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="fs-vid-background">
        <video autoplay muted loop playsinline>
            <source src="https://cdn.pixabay.com/video/2020/07/13/44563-439940132_large.mp4" type="video/mp4">
        </video>
    </div>

    <div id="player-wrapper">
        <div id="player"></div>
    </div>
