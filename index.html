<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f4000b">
    <title>MARGINAL 102.1 FM</title>

    <!-- Usamos tus archivos directos sin carpetas -->
    <link href="style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="lunaradio-animado.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            font-family: "Open Sans", sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Fondo negro por si falla el video */
            overflow: hidden; /* Evita scroll en móvil */
            display: flex;
            justify-content: center; /* Centra horizontalmente */
            align-items: center; /* Centra verticalmente */
        }

        /* Estilos del video de fondo */
        .fs-vid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Fondo por debajo de todo */
            overflow: hidden;
        }

        .fs-vid-background video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cubre toda la pantalla sin deformarse */
        }

        /* Contenedor principal del reproductor */
        #player-main-container {
            position: relative;
            z-index: 10; /* Por encima del video */
            width: 90%; /* Ancho responsivo */
            max-width: 400px; /* Límite en desktop */
            display: flex;
            justify-content: center;
        }

        /* El contenedor que usa Lunaradio */
        #player {
            width: 100%;
            height: auto;
            position: relative;
        }

        /* Estilos del footer */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 10px;
        }

        footer a {
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- Fondo de Video -->
    <div class="fs-vid-background">
        <video autoplay muted loop playsinline>
            <source src="https://cdn.pixabay.com/video/2020/07/13/44563-439940132_large.mp4" type="video/mp4">
            <!-- Si tienes un video local, usa este formato: <source src="video-fondo.mp4" type="video/mp4"> -->
        </video>
    </div>

    <!-- Contenedor del Reproductor (este será visible) -->
    <div id="player-main-container">
        <div id="player"></div>
    </div>

    <script>
        // Detección básica de móvil para ajustar interfaz
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        // Inicialización de Lunaradio
        $("#player").lunaradio({
            userinterface: isMobile ? "small" : "big", // Interfaz pequeña para móvil
            backgroundcolor: "transparent",
            fontcolor: "#ffffff",
            hightlightcolor: "#000000",
            fontname: "Roboto",
            googlefont: "",
            fontratio: "0.4",
            radioname: "RADIO MARGINAL 102.1 FM LA RADIO QUE MANDA",
            scroll: "true",
            coverimage: "https://i.imgur.com/8hUnK73.png",
            onlycoverimage: "false",
            coverstyle: "animated",
            usevisualizer: isMobile ? "real" : "real", // Visualizador activo siempre
            visualizertype: "8",
            itunestoken: "1000lIPN",
            metadatatechnic: "directly",
            corsproxy: "",
            usestreamcorsproxy: "false",
            streamurl: "https://stream.zeno.fm/esukq068guhvv",
            streamtype: "icecast2",
            idzeno: "esukq068guhvv",
            icecastmountpoint: "/radio.mp3",
            shoutcastpath: "",
            shoutcastid: "1",
            metadatainterval: "26000",
            volume: "100",
            debug: "false",
            autoplay: isMobile ? "false" : "true", // En móvil es mejor desactivar autoplay
            displayliveicon: "true",
            visualizeropacity: "1.0",
            multicolorvisualizer: "true",
            color1: "#00FF00",
            color2: "#ffff00",
            color3: "#FF1F6F",
            color4: "#FF1F6F"
        });
    </script>

    <footer>
        <div>
            &copy; Copyright 2026 - <a href="https://www.presenciaradioytv.com/">Presencia Streaming</a>
        </div>
    </footer>

</body>
</html>
